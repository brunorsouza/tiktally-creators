# Supabase local config — TikTally Creator
# project_id vira o nome do stack local; troque pelo ref real ao linkar (`supabase link`).
project_id = "tiktally-creator"

# Nomes seguem o padrão do TikTally Seller: domínio-ação, sem citar o fornecedor.
# O nome da função aparece na aba de rede do navegador, então ele não deve
# descrever qual API externa está sendo chamada.

[functions.affiliate-proxy]
verify_jwt = false  # dispatcher de todos os endpoints; JWT validado em creatorAuth.ts

[functions.account-connect]
verify_jwt = false  # recebe o code do OAuth; JWT validado dentro da função

[functions.capture-lead]
verify_jwt = false  # formulário público de lead; a escrita usa service-role dentro da função
